# Release build, run by GitHub Actions (`make release` on a v* tag) with
# GITHUB_TOKEN.
version: 2

project_name: gl-issues

before:
  hooks:
    - go mod tidy -diff # fails on an untidy go.mod rather than rewriting it (Go 1.23+)
    - go mod verify

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin] # a Linux/macOS tool; no Windows build
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, CHANGELOG.md, CONTRIBUTING.md, SECURITY.md, AGENTS.md, go.mod, config.example.toml, docs/install.md, docs/configuration.md, docs/dashboard.md, docs/scripting.md, docs/troubleshooting.md, docs/linux.md, docs/demo-dark.gif, docs/demo-light.gif] # the README's and docs' links

nfpms:
  - package_name: gl-issues
    vendor: gl-issues
    homepage: https://github.com/ansgomez/gl-issues
    maintainer: Andres Gomez <8250065+ansgomez@users.noreply.github.com>
    description: Terminal issue dashboard and CLI for GitLab groups, via glab.
    license: MIT
    formats: [deb, rpm]
    recommends: [glab] # needed at run time; not packaged by every distribution
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gl-issues/LICENSE
      - src: config.example.toml
        dst: /usr/share/doc/gl-issues/config.example.toml

checksum:
  name_template: checksums.txt

# Software bill of materials for each archive (needs syft).
sboms:
  - artifacts: archive

# Keyless signing of the checksum file with Sigstore (needs cosign and an
# OIDC token: the GitHub id-token permission).
# Verify: cosign verify-blob --bundle checksums.txt.sigstore.json \
#   --certificate-identity-regexp '^https://github\.com/ansgomez/gl-issues/\.github/workflows/release\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    output: true

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:", Merge]

release:
  draft: false
  prerelease: auto
  footer: |
    Verify downloads: `sha256sum -c checksums.txt --ignore-missing` (Linux) or `shasum -a 256 -c checksums.txt --ignore-missing` (macOS), and
    `cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity-regexp '^https://github\.com/ansgomez/gl-issues/\.github/workflows/release\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`


# Homebrew (macOS and Linux): uncomment once a tap repository exists,
# e.g. github.com/<you>/homebrew-tap, and a HOMEBREW_TAP_TOKEN secret is set.
# homebrew_casks:
#   - repository:
#       owner: <you>
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     homepage: https://github.com/ansgomez/gl-issues
#     description: Terminal issue dashboard and CLI for GitLab groups, via glab.
#     license: MIT
