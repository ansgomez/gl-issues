# Release build: `make release` on a v* tag, with GITHUB_TOKEN. The
# checks run first, in a job that can only read: the write permissions
# the release needs are not handed to the tools they run.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # secrets scan covers the whole history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci # the same checks as ci.yml: a tag never skips them

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # keyless signing (cosign) and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog from git history
          persist-credentials: false # goreleaser uses GITHUB_TOKEN from env; nothing pushes
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install cosign and syft
        run: make release-tools && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
